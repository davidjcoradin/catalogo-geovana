<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geovana Corradini - Representações | Catálogos</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#17263c;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#1645a3,#2674e5);color:white;text-align:center;padding:36px 16px}h1{font-size:clamp(1.5rem,4vw,2.2rem);margin:0 0 8px}header p{margin:0 0 14px}#count{background:#ffffff26;border-radius:20px;padding:6px 14px;font-size:.9rem}main{max-width:1180px;margin:24px auto 55px;padding:0 18px}#search{width:100%;padding:15px 18px;border:1px solid #cad4e2;border-radius:12px;font-size:1rem;margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.card{background:white;border:1px solid #e3e9f1;border-radius:15px;padding:18px;box-shadow:0 3px 12px #1023400c;cursor:pointer;text-align:center;color:inherit;font:inherit;transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-3px);box-shadow:0 9px 24px #10234020}.logo{height:90px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}.logo img{max-width:100%;max-height:86px;object-fit:contain}.fallback{width:76px;height:76px;display:flex;align-items:center;justify-content:center;background:#e9f0ff;color:#2459bc;border-radius:15px;font-size:1.6rem;font-weight:800}.brand{font-weight:750;font-size:1.08rem}.qty{font-size:.84rem;color:#66768d;margin-top:7px}.topline{display:flex;align-items:center;gap:12px;margin-bottom:18px}.back{background:white;border:1px solid #cbd6e5;border-radius:9px;padding:10px 14px;cursor:pointer;font:inherit}.topline h2{margin:0;font-size:1.25rem}.catalog{display:block;text-decoration:none;color:#173d85;background:white;border:1px solid #e1e8f0;border-radius:12px;padding:18px;font-weight:600}.catalog:hover{border-color:#2563eb;background:#f8fbff}.empty{grid-column:1/-1;text-align:center;color:#64748b;padding:35px}footer{background:#192b46;color:white;text-align:center;padding:25px 16px}footer a{color:white}.wa{position:fixed;right:20px;bottom:20px;background:#20b858;color:white;border-radius:100px;padding:14px 18px;text-decoration:none;font-weight:700;box-shadow:0 4px 14px #0003}@media(max-width:550px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:12px}.logo{height:75px}.logo img{max-height:70px}.brand{font-size:.95rem}}
</style></head><body><header><h1>Geovana Corradini - Representações</h1><p>Explore nossos catálogos de produtos</p><span id="count">Carregando catálogos...</span></header><main><p><a href="brinquedos.html" style="display:inline-block;padding:14px 20px;background:#244ab5;color:white;border-radius:10px;text-decoration:none;font-weight:700">Brinquedos e pedidos →</a></p><input id="search" placeholder="🔎 Buscar fornecedor ou catálogo..." aria-label="Buscar fornecedor ou catálogo"><div id="content" class="grid"></div></main><footer><strong>Geovana Corradini - Representações</strong><p>WhatsApp: <a href="https://wa.me/5511989637298">(11) 98963-7298</a></p><small>© 2026 - Todos os direitos reservados</small></footer><a class="wa" href="https://wa.me/5511989637298?text=Ol%C3%A1!%20Gostaria%20de%20mais%20informa%C3%A7%C3%B5es%20sobre%20os%20cat%C3%A1logos." target="_blank" rel="noopener">WhatsApp</a>
<script>
// Nomes compostos e exceções: ajuste aqui se cadastrar novas marcas.
const MARCAS=['Y888','RIO TIJUCAS','TOP RIO','CIAFLOR','BELLA GARDEM','BELLO CHARME','DOLCE HOME','GIRA IMPORTS','MINI TOYS','ZONA LIVRE','FREECOM','UNIKEHOME','HORAPLAST','RELOBRAZ','BANDEIRANTES','CASAVITA','CASCAVEL','DECORATTO','DCARTE','FENZZA','FORTAL','ALLMIX','AILTON','AZZU','BMB','CIM','FWB','GESSELE','GPX','INGA','LIDER','LYOR','MARES','MGV','PRODAC','WOLF','WOLFF','Y888','ZEIN','QX'];
const aliases={'WOLF':'WOLFF','CIA':'CIAFLOR','WOLFF':'WOLFF'};
function marcaDe(nome){const s=nome.trim().toUpperCase();return MARCAS.find(m=>s===m||s.startsWith(m+' '))||s.split(' ')[0]}
function slug(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
let grupos=new Map(),selecionada=null;const content=document.getElementById('content'),search=document.getElementById('search'),count=document.getElementById('count');
function logoNode(marca){const wrap=document.createElement('div');wrap.className='logo';const img=document.createElement('img');img.alt='Logo '+marca;img.loading='lazy';img.src='logos/'+slug(aliases[marca]||marca)+'.png';img.onerror=()=>{wrap.replaceChildren();const f=document.createElement('div');f.className='fallback';f.textContent=marca.slice(0,2);wrap.append(f)};wrap.append(img);return wrap}
function render(){const termo=search.value.trim().toLocaleLowerCase('pt-BR');content.replaceChildren();if(selecionada){content.className='';const top=document.createElement('div');top.className='topline';const back=document.createElement('button');back.className='back';back.textContent='← Fornecedores';back.onclick=()=>{selecionada=null;search.value='';render()};const h=document.createElement('h2');h.textContent=selecionada;top.append(back,h);content.append(top);const grid=document.createElement('div');grid.className='grid';let lista=(grupos.get(selecionada)||[]).filter(x=>x.nome.toLocaleLowerCase('pt-BR').includes(termo));lista.forEach(x=>{const a=document.createElement('a');a.className='catalog';a.href='visualizar.html?arquivo='+encodeURIComponent(x.arquivo)+'&nome='+encodeURIComponent(x.nome);a.textContent='📄 '+x.nome+' →';grid.append(a)});if(!lista.length)grid.innerHTML='<p class="empty">Nenhum catálogo encontrado.</p>';content.append(grid);return}
content.className='grid';const marcas=[...grupos.keys()].sort((a,b)=>a.localeCompare(b,'pt-BR')).filter(m=>m.toLocaleLowerCase('pt-BR').includes(termo)||grupos.get(m).some(x=>x.nome.toLocaleLowerCase('pt-BR').includes(termo)));marcas.forEach(m=>{const b=document.createElement('button');b.className='card';b.append(logoNode(m));const title=document.createElement('div');title.className='brand';title.textContent=m;const q=document.createElement('div');q.className='qty';q.textContent=grupos.get(m).length+' catálogo(s)';b.append(title,q);b.onclick=()=>{selecionada=m;search.value='';render();window.scrollTo(0,0)};content.append(b)});if(!marcas.length)content.innerHTML='<p class="empty">Nenhum fornecedor encontrado.</p>'}
search.addEventListener('input',render);
fetch('catalogos.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(data=>{if(!Array.isArray(data))throw new Error('O JSON precisa ser uma lista');data.forEach(x=>{if(!x||typeof x.nome!=='string'||typeof x.arquivo!=='string')return;const m=marcaDe(x.nome);if(!grupos.has(m))grupos.set(m,[]);grupos.get(m).push(x)});count.textContent=data.length+' catálogos em '+grupos.size+' fornecedores';render()}).catch(err=>{console.error('Falha ao carregar catálogos:',err);count.textContent='Catálogos indisponíveis';content.innerHTML='<p class="empty">Não foi possível carregar catalogos.json. Confira o arquivo publicado e o console do navegador.</p>'});
</script></body></html>
